# Publie le site sur GitHub Pages à chaque envoi sur « main ».
# Prérequis (une fois) : dépôt GitHub → Settings → Pages → Source : « GitHub Actions ».
# Optionnel : variable de dépôt DROPBOX_APP_KEY (Settings → Secrets and variables → Actions → Variables)
# pour préremplir la clé d'application Dropbox.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tests du script de données
        run: python -m unittest discover tools/data
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Construction
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          VITE_DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
